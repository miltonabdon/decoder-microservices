server:
  port: 8081

spring:
  application:
    name: auth-user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authuser_db}
    username: ${DB_USER:decoder}
    password: ${DB_PASSWORD:decoder123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:decoder}
    password: ${RABBITMQ_PASSWORD:decoder123}

decoder:
  jwt:
    secret: ${JWT_SECRET:decoder-poc-jwt-secret-key-at-least-256-bits-long-for-hs512}
    expiration-ms: 86400000
  rabbitmq:
    exchanges:
      users: ms.users.exchange
      notification-commands: ms.notification.commands.exchange
    queues:
      users-course: ms.courseservice.users.queue
      users-notification: ms.notificationservice.users.queue
    routing-keys:
      user-created: user.created
      user-updated: user.updated
      user-deleted: user.deleted

logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
