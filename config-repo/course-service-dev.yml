server:
  port: 8082

spring:
  application:
    name: course-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:course_db}
    username: ${DB_USER:decoder}
    password: ${DB_PASSWORD:decoder123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:decoder}
    password: ${RABBITMQ_PASSWORD:decoder123}
  cloud:
    openfeign:
      client:
        config:
          auth-user-service:
            connect-timeout: 3000
            read-timeout: 5000

decoder:
  rabbitmq:
    exchanges:
      users: ms.users.exchange
      courses: ms.courses.exchange
    queues:
      users-course: ms.courseservice.users.queue
      enrollment-notification: ms.notificationservice.enrollments.queue
    routing-keys:
      user-created: user.created
      user-updated: user.updated
      user-deleted: user.deleted
      enrollment-created: enrollment.created
      enrollment-deleted: enrollment.deleted

resilience4j:
  circuitbreaker:
    instances:
      auth-user-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
  retry:
    instances:
      auth-user-service:
        max-attempts: 3
        wait-duration: 1s

logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
