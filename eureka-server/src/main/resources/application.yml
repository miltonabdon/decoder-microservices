server:
  port: 8761

spring:
  application:
    name: eureka-server
  security:
    user:
      name: admin
      password: admin123

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  server:
    enable-self-preservation: false
    renewal-percent-threshold: 0.49

management:
  endpoints:
    web:
      exposure:
        include: health,info
