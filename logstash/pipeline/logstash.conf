input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [app_name] {
    mutate {
      add_field => { "service" => "%{[app_name]}" }
    }
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "decoder-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
