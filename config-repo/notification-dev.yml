server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USER:decoder}
    password: ${DB_PASSWORD:decoder123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:decoder}
    password: ${RABBITMQ_PASSWORD:decoder123}

decoder:
  rabbitmq:
    exchanges:
      users: ms.users.exchange
      enrollments: ms.courses.exchange
      notification-commands: ms.notification.commands.exchange
    queues:
      users-notification: ms.notificationservice.users.queue
      enrollment-notification: ms.notificationservice.enrollments.queue
      notification-commands: ms.notification.commands.queue
      notification-commands-dlq: ms.notification.commands.dlq
    routing-keys:
      user-created: user.created
      user-deleted: user.deleted
      enrollment-created: enrollment.created

logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}
